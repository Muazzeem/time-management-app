<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}Time Tracker{% endblock %}</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<style>
  :root { --brand: #3c6e58; --brand-dark: #2f5745; }
  body { background: #f4f6f8; }
  .navbar-brand { font-weight: 700; letter-spacing: .2px; }
  .bg-brand { background-color: var(--brand) !important; }
  .text-brand { color: var(--brand) !important; }
  .btn-brand { background-color: var(--brand); border-color: var(--brand); color: #fff; }
  .btn-brand:hover { background-color: var(--brand-dark); border-color: var(--brand-dark); color: #fff; }
  .month-card { text-decoration: none; transition: transform .12s ease, box-shadow .12s ease; }
  .month-card:hover { transform: translateY(-3px); box-shadow: 0 .75rem 1.5rem rgba(0,0,0,.09) !important; }
  .stat-icon { font-size: 1.6rem; opacity: .85; }
  table input.form-control, table select.form-select { font-size: .875rem; }
  .status-Not-Started { background: #f1f5f9; color: #475569; }
  .status-In-Progress { background: #fff3cd; color: #92400e; }
  .status-Completed { background: #d1e7dd; color: #146c43; }
  .status-Blocked { background: #f8d7da; color: #b02a37; }
  .status-select { font-weight: 600; border-radius: 999px; cursor: pointer; }
  .cell-date, .cell-task { color: #1d4ed8; }
  footer.app-footer { color: #9ca3af; font-size: .8rem; }
</style>
{% block extra_head %}{% endblock %}
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-brand mb-4 shadow-sm">
  <div class="container">
    <a class="navbar-brand" href="{{ url_for('index') }}">
      <i class="bi bi-clock-history me-2"></i>Time Tracker
    </a>
  </div>
</nav>

<div class="container pb-5">
  {% block content %}{% endblock %}
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
{% block extra_scripts %}{% endblock %}
</body>
</html>
